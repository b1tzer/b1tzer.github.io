<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 136" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="264" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">BIO 线程生命周期（单个连接）</text>

  <!-- Timeline bar -->
  <rect x="34" y="42" width="221" height="31" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.3"/>
  <text x="144" y="63" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">read 阻塞等待 200ms</text>

  <rect x="255" y="42" width="34" height="31" rx="3" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="272" y="63" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="9">处理</text>
  <text x="272" y="75" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="8">5ms</text>

  <rect x="289" y="42" width="204" height="31" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.3"/>
  <text x="391" y="63" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">read 阻塞等待 500ms</text>

  <!-- Bracket: wasted time -->
  <line x1="34" y1="89" x2="255" y2="89" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <line x1="34" y1="85" x2="34" y2="94" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <line x1="255" y1="85" x2="255" y2="94" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="144" y="104" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="10">线程被白白占用</text>

  <line x1="289" y1="89" x2="493" y2="89" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <line x1="289" y1="85" x2="289" y2="94" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <line x1="493" y1="85" x2="493" y2="94" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="391" y="104" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="10">又白等</text>

  <!-- Stats -->
  <text x="264" y="126" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">计算 5ms / 总耗时 705ms ≈ 0.7% — 99%+ 的时间在"等"</text>
</svg>