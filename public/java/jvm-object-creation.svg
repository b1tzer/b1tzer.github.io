<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 663" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-text-3)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="264" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">对象创建流程（new User("Tom")）</text>

  <!-- Step 1: 类加载检查 -->
  <rect x="144" y="42" width="238" height="41" rx="5" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="178" y="60" fill="var(--diagram-accent-1)" font-weight="bold">1. 类加载检查</text>
  <text x="264" y="76" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">User 类是否已加载？没有 → 先执行类加载</text>
  <line x1="264" y1="83" x2="264" y2="104" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- Step 2: 分配内存 -->
  <rect x="102" y="107" width="323" height="170" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.3"/>
  <text x="264" y="128" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold" font-size="12">2. 分配内存</text>

  <!-- 内存是否规整 -->
  <rect x="123" y="138" width="136" height="36" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="191" y="153" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="10" font-weight="bold">堆内存是否规整？</text>
  <text x="191" y="167" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">由 GC 算法决定</text>

  <!-- 是 → 指针碰撞 -->
  <line x1="123" y1="156" x2="89" y2="156" stroke="var(--diagram-text-3)" stroke-width="0.8" marker-end="url(#arrowRight)"/>
  <rect x="17" y="139" width="70" height="32" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="52" y="154" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="9" font-weight="bold">是</text>
  <text x="52" y="166" text-anchor="middle" fill="var(--diagram-arrow)" font-size="8">指针碰撞</text>

  <!-- 否 → 空闲列表 -->
  <line x1="259" y1="156" x2="293" y2="156" stroke="var(--diagram-text-3)" stroke-width="0.8" marker-end="url(#arrowRight)"/>
  <rect x="296" y="139" width="70" height="32" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="331" y="154" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="9" font-weight="bold">否</text>
  <text x="331" y="166" text-anchor="middle" fill="var(--diagram-arrow)" font-size="8">空闲列表</text>

  <!-- 线程安全 -->
  <rect x="123" y="185" width="264" height="82" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="201" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="10" font-weight="bold">线程安全？</text>

  <!-- TLAB -->
  <rect x="136" y="209" width="238" height="26" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="255" y="226" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="9">TLAB：每个线程在 Eden 有私有缓冲区，无需 CAS</text>

  <!-- TLAB 用完 -->
  <rect x="136" y="240" width="238" height="22" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="255" y="255" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="9">TLAB 用完 → Eden 共享区分配，需要 CAS 同步</text>

  <line x1="264" y1="277" x2="264" y2="298" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- Step 3: 初始化零值 -->
  <rect x="144" y="301" width="238" height="48" rx="5" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="264" y="320" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">3. 初始化零值</text>
  <text x="264" y="335" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">int=0, boolean=false, 引用=null</text>
  <text x="264" y="345" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">JVM 保证零值初始化，字段使用前必有确定值</text>
  <line x1="264" y1="348" x2="264" y2="369" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- Step 4: 设置对象头 -->
  <rect x="144" y="372" width="238" height="48" rx="5" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.3"/>
  <text x="264" y="391" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">4. 设置对象头</text>
  <text x="264" y="406" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">Mark Word（hashCode、GC 年龄、锁状态）</text>
  <text x="264" y="416" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">Klass Pointer（指向方法区中的类元数据）</text>
  <line x1="264" y1="420" x2="264" y2="440" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arrowDown)"/>

  <!-- Step 5: 执行 <init> -->
  <rect x="144" y="444" width="238" height="41" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.3"/>
  <text x="264" y="462" text-anchor="middle" fill="var(--diagram-accent-4)" font-weight="bold">5. 执行 &lt;init&gt; 构造方法</text>
  <text x="264" y="478" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">你写的构造方法代码</text>

  <!-- 底部注释 -->
  <rect x="110" y="505" width="306" height="54" rx="3" fill="none" stroke="var(--diagram-accent-3)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="264" y="522" text-anchor="middle" fill="var(--diagram-accent-3)" font-size="10" font-weight="bold">TLAB 是关键优化</text>
  <text x="264" y="537" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">没有 TLAB，多线程同时在 Eden 分配对象需要加锁（CAS）</text>
  <text x="264" y="551" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">TLAB 让每个线程有自己的"私人领地"，分配只需移动指针</text>

  <!-- 流程箭头装饰 -->
  <line x1="264" y1="484" x2="264" y2="503" stroke="var(--diagram-accent-3)" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- 底部说明 -->
  <text x="264" y="586" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">-XX:+UseTLAB 默认开启，大部分对象分配无需真正同步</text>
  <text x="264" y="604" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">超过 -XX:PretenureSizeThreshold 的大对象直接分配在老年代</text>

  <!-- 顶部标注行号 -->
  <text x="17" y="654" fill="var(--diagram-ghost)" font-size="8">共 5 步：类加载 → 分配内存 → 零值初始化 → 设置对象头 → 执行构造方法</text>
</svg>
