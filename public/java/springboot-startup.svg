<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663 595" width="663" height="595" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: var(--diagram-text-1); }
  .label { font-size: 12px; fill: var(--diagram-text-1); }
  .note { font-size: 11px; fill: var(--diagram-text-2); }
  .arrow { stroke: var(--diagram-accent-3); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: var(--diagram-surface-3); stroke: var(--diagram-text-2); stroke-width: 1.5; }
  .highlight { fill: var(--diagram-accent-bg-4); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
  .action { fill: var(--diagram-accent-bg-2); stroke: var(--diagram-accent-2); stroke-width: 1.5; }
  .important { fill: var(--diagram-accent-bg-5); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
  .step { fill: var(--diagram-accent-bg-3b); stroke: var(--diagram-accent-3); stroke-width: 1.5; }
  .note-box { fill: var(--diagram-surface-2); stroke: var(--diagram-stroke-1); stroke-width: 1; }
  .cache { fill: var(--diagram-accent-4); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-3)"/>
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-2)"/>
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-4)"/>
  </marker>
</defs>
<text x="332" y="24" class="title">Spring Boot 自动配置流程</text>
<rect x="212" y="42" width="238" height="34" class="box important"/>
<text x="390.0" y="70.0" class="label">@SpringBootApplication</text>
<line x1="272" y1="76" x2="153" y2="102" class="arrow"/>
<line x1="391" y1="76" x2="510" y2="102" class="arrow"/>
<rect x="42" y="102" width="221" height="31" class="box action"/>
<text x="180.0" y="138.0" class="label">@ComponentScan</text>
<rect x="400" y="102" width="221" height="31" class="box step"/>
<text x="600.0" y="138.0" class="label">@EnableAutoConfiguration</text>
<text x="153" y="149" class="note">扫描 @Component/@Service/@Controller</text>
<line x1="510" y1="133" x2="510" y2="157" class="arrow"/>
<rect x="400" y="157" width="221" height="31" class="box highlight"/>
<text x="600.0" y="203.0" class="label">AutoConfiguration.imports</text>
<line x1="510" y1="188" x2="510" y2="208" class="arrow"/>
<line x1="510" y1="208" x2="144" y2="230" class="arrow"/>
<rect x="51" y="230" width="187" height="24" class="box step"/>
<text x="144" y="241" class="label" font-weight="bold">DataSourceAutoConfiguration</text>
<rect x="51" y="253" width="187" height="58" class="box note-box"/>
<text x="58" y="267" text-anchor="start" class="note">@ConditionalOnClass(DataSource.class) ✓</text>
<text x="58" y="284" text-anchor="start" class="note">@ConditionalOnMissingBean(DataSource.class) ✓</text>
<text x="58" y="301" text-anchor="start" class="note">绑定 spring.datasource.*</text>
<line x1="510" y1="208" x2="366" y2="230" class="arrow"/>
<rect x="272" y="230" width="187" height="24" class="box step"/>
<text x="366" y="241" class="label" font-weight="bold">WebMvcAutoConfiguration</text>
<rect x="272" y="253" width="187" height="24" class="box note-box"/>
<text x="279" y="267" text-anchor="start" class="note">@ConditionalOnWebApplication ✓</text>
<line x1="510" y1="208" x2="586" y2="230" class="arrow"/>
<rect x="493" y="230" width="187" height="24" class="box step"/>
<text x="586" y="241" class="label" font-weight="bold">JacksonAutoConfiguration</text>
<rect x="493" y="253" width="187" height="24" class="box note-box"/>
<text x="500" y="267" text-anchor="start" class="note">@ConditionalOnClass(ObjectMapper.class) ✓</text>
<text x="332" y="442" class="label" font-size="12">💡 自动配置是&quot;兜底&quot;而非&quot;强制&quot;</text>
<text x="332" y="463" class="note">开发者自定义 Bean 优先（@ConditionalOnMissingBean）</text>

</svg>