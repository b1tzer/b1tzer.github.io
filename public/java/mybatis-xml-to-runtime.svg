<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 238" font-family="'Noto Sans SC','PingFang SC','Myanmar',sans-serif" font-size="11">
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-4)"/></marker>
  </defs>
  <text x="238" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">XML 解析 → 运行时动态 SQL</text>

  <!-- XML side -->
  <rect x="26" y="42" width="170" height="153" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="110" y="65" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="12">XML 解析阶段（启动时）</text>

  <rect x="42" y="82" width="136" height="94" rx="3" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-1)" stroke-width="0.8"/>
  <text x="51" y="100" fill="var(--diagram-text-1)" font-size="10">&lt;select&gt;</text>
  <text x="61" y="117" fill="var(--diagram-text-2)" font-size="10">&lt;where&gt;</text>
  <text x="71" y="134" fill="var(--diagram-accent-4)" font-size="10">&lt;if test=..&gt;</text>
  <text x="71" y="151" fill="var(--diagram-text-2)" font-size="10">&lt;/if&gt;</text>
  <text x="61" y="168" fill="var(--diagram-text-2)" font-size="10">&lt;/where&gt;</text>

  <!-- Arrow -->
  <line x1="196" y1="119" x2="253" y2="119" stroke="var(--diagram-accent-4)" stroke-width="1.7" marker-end="url(#ar3)"/>
  <text x="224" y="110" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="9">解析为</text>

  <!-- Runtime side -->
  <rect x="255" y="42" width="196" height="153" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="353" y="65" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="12">运行时（每次调用）</text>

  <rect x="272" y="82" width="162" height="51" rx="3" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-1)" stroke-width="0.8"/>
  <text x="280" y="100" fill="var(--diagram-accent-3)" font-weight="bold" font-size="10">MixedSqlNode</text>
  <text x="291" y="117" fill="var(--diagram-text-2)" font-size="10">├─ TextSqlNode</text>
  <text x="291" y="129" fill="var(--diagram-text-2)" font-size="10">├─ IfSqlNode</text>

  <rect x="272" y="143" width="162" height="37" rx="3" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="0.8"/>
  <text x="353" y="162" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold" font-size="10">apply(param) → BoundSql</text>
  <text x="353" y="175" text-anchor="middle" fill="var(--diagram-text-2)" font-size="9">（最终可执行 SQL）</text>

  <!-- Footer -->
  <text x="238" y="221" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">启动时解析 XML 为 SqlNode 树，运行时根据参数动态拼接 SQL</text>
</svg>