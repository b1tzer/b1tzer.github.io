<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 374 391" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="187" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">Java 程序的执行流程</text>

  <!-- Step 1: Source -->
  <rect x="85" y="41" width="204" height="37" rx="7" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="187" y="65" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">Hello.java（源码）</text>
  <line x1="187" y1="78" x2="187" y2="100" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="201" y="94" fill="var(--diagram-text-3)" font-size="9">javac 编译</text>

  <!-- Step 2: Bytecode -->
  <rect x="85" y="104" width="204" height="37" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="187" y="128" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Hello.class（字节码）</text>
  <line x1="187" y1="141" x2="187" y2="163" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="201" y="156" fill="var(--diagram-text-3)" font-size="9">JVM 加载</text>

  <!-- Step 3: ClassLoader -->
  <rect x="85" y="167" width="204" height="37" rx="7" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.3"/>
  <text x="187" y="190" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">ClassLoader 加载字节码</text>
  <line x1="187" y1="204" x2="187" y2="226" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Step 4: JVM verify -->
  <rect x="85" y="230" width="204" height="37" rx="7" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.3"/>
  <text x="187" y="253" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">JVM 验证、准备、初始化</text>
  <line x1="187" y1="267" x2="187" y2="289" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Step 5: Interpret/JIT -->
  <rect x="85" y="292" width="204" height="37" rx="7" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.3"/>
  <text x="187" y="316" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold">解释执行 / JIT 编译</text>
  <line x1="187" y1="330" x2="187" y2="352" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- Step 6: CPU -->
  <rect x="85" y="355" width="204" height="37" rx="7" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.3"/>
  <text x="187" y="379" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">CPU 执行机器码</text>

  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker></defs>
</svg>