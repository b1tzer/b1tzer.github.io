<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 493" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arD3" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
    <marker id="arR3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-5)"/>
    </marker>
  </defs>

  <text x="255" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">HTTP 状态码选择决策树</text>

  <!-- Root node -->
  <rect x="170" y="36" width="170" height="31" rx="15" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="255" y="54" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)" font-weight="bold">请求到达</text>
  <line x1="255" y1="66" x2="255" y2="82" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arD3)"/>

  <!-- Decision nodes and results -->
  <!-- 400 -->
  <line x1="255" y1="82" x2="119" y2="82" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <line x1="119" y1="82" x2="119" y2="94" stroke="var(--diagram-accent-5)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="42" y="95" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="119" y="111" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-5)">语法/格式错误？</text>
  <line x1="119" y1="121" x2="119" y2="133" stroke="var(--diagram-accent-5)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="42" y="134" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="119" y="150" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-5)" font-weight="bold">400 Bad Request</text>

  <!-- 401 -->
  <line x1="255" y1="82" x2="255" y2="94" stroke="var(--diagram-accent-4)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="95" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="111" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">需要认证？</text>
  <line x1="255" y1="121" x2="255" y2="133" stroke="var(--diagram-accent-4)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="134" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="150" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-4)" font-weight="bold">401 Unauthorized</text>

  <!-- 403 -->
  <line x1="255" y1="162" x2="255" y2="178" stroke="var(--diagram-arrow)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="180" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="196" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">已认证但无权限？</text>
  <line x1="255" y1="206" x2="255" y2="218" stroke="var(--diagram-accent-4)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="219" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="235" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-4)" font-weight="bold">403 Forbidden</text>

  <!-- 404 -->
  <line x1="255" y1="246" x2="255" y2="264" stroke="var(--diagram-arrow)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="265" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="281" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">资源不存在？</text>
  <line x1="255" y1="291" x2="255" y2="303" stroke="var(--diagram-accent-4)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="304" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="320" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-4)" font-weight="bold">404 Not Found</text>

  <!-- 405 -->
  <line x1="255" y1="332" x2="255" y2="348" stroke="var(--diagram-arrow)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="350" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="366" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">方法不支持？</text>
  <line x1="255" y1="376" x2="255" y2="388" stroke="var(--diagram-accent-4)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="178" y="389" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="255" y="405" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-4)" font-weight="bold">405 Method Not Allowed</text>

  <!-- Success branch (right side) -->
  <line x1="255" y1="82" x2="391" y2="82" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <line x1="391" y1="82" x2="391" y2="94" stroke="var(--diagram-accent-2)" stroke-width="0.8" marker-end="url(#arD3)"/>

  <!-- 201 -->
  <rect x="314" y="95" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="391" y="111" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">创建成功？</text>
  <line x1="391" y1="121" x2="391" y2="133" stroke="var(--diagram-accent-2)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="134" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="391" y="150" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-2)" font-weight="bold">201 Created</text>

  <!-- 204 -->
  <line x1="391" y1="162" x2="391" y2="178" stroke="var(--diagram-arrow)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="180" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="391" y="196" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">删除成功（无返回）？</text>
  <line x1="391" y1="206" x2="391" y2="218" stroke="var(--diagram-accent-2)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="219" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="391" y="235" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-2)" font-weight="bold">204 No Content</text>

  <!-- 200 -->
  <line x1="391" y1="246" x2="391" y2="264" stroke="var(--diagram-arrow)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="265" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="391" y="281" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">普通成功？</text>
  <line x1="391" y1="291" x2="391" y2="303" stroke="var(--diagram-accent-2)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="304" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="391" y="320" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-2)" font-weight="bold">200 OK</text>

  <!-- 500 -->
  <line x1="391" y1="332" x2="391" y2="348" stroke="var(--diagram-arrow)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="350" width="153" height="26" rx="5" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="0.8"/>
  <text x="391" y="366" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-3)">服务器异常？</text>
  <line x1="391" y1="376" x2="391" y2="388" stroke="var(--diagram-accent-3)" stroke-width="0.8" marker-end="url(#arD3)"/>
  <rect x="314" y="389" width="153" height="24" rx="3" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="0.8"/>
  <text x="391" y="405" text-anchor="middle" font-size="10" fill="var(--diagram-accent-text-3)" font-weight="bold">500 Internal Server Error</text>
</svg>
