<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 476" width="544" height="476">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="var(--diagram-accent-2)"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="var(--diagram-accent-5)"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="var(--diagram-text-2)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="272" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">Monitor 工作流程：synchronized 字节码执行</text>

  <!-- Bytecode source box -->
  <rect x="17" y="38" width="238" height="153" rx="7" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1" filter="url(#shadow)"/>
  <text x="136" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--diagram-text-1)">javap -c 反编译</text>
  <text x="30" y="75" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">public void syncBlock();</text>
  <text x="30" y="88" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">  Code:</text>
  <text x="30" y="102" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">    6: <tspan font-weight="bold" fill="var(--diagram-accent-text-1)">monitorenter</tspan>   ← 获取监视器</text>
  <text x="30" y="116" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">    8: invokevirtual #3  doSomething()</text>
  <text x="30" y="129" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   12: <tspan font-weight="bold" fill="var(--diagram-accent-2)">monitorexit</tspan>    ← 正常释放</text>
  <text x="30" y="143" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   16: astore_2  (异常)</text>
  <text x="30" y="156" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   18: <tspan font-weight="bold" fill="var(--diagram-accent-5)">monitorexit</tspan>    ← 异常也释放!</text>
  <text x="30" y="170" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   20: athrow</text>
  <text x="30" y="185" font-size="8" fill="var(--diagram-text-3)">编译器保证生成两个 monitorexit</text>

  <!-- ObjectMonitor box -->
  <rect x="289" y="38" width="238" height="204" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="408" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-3)">ObjectMonitor</text>

  <!-- _owner -->
  <rect x="306" y="70" width="204" height="31" rx="5" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="0.8"/>
  <text x="319" y="85" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-3)">_owner</text>
  <text x="319" y="97" font-size="8" fill="var(--diagram-accent-text-3)">当前持锁线程 (CAS 写入)</text>
  <text x="489" y="89" text-anchor="end" font-family="monospace" font-size="9" fill="var(--diagram-accent-3)">Thread-A</text>

  <!-- _recursions -->
  <rect x="306" y="105" width="204" height="26" rx="5" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="0.8"/>
  <text x="319" y="122" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-3)">_recursions</text>
  <text x="489" y="122" text-anchor="end" font-family="monospace" font-size="9" fill="var(--diagram-accent-3)">重入计数: 1</text>

  <!-- _EntryList -->
  <rect x="306" y="138" width="204" height="34" rx="5" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="319" y="151" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-5)">_EntryList</text>
  <text x="319" y="166" font-size="8" fill="var(--diagram-accent-5)">等锁队列 → BLOCKED</text>
  <text x="489" y="159" text-anchor="end" font-family="monospace" font-size="9" fill="var(--diagram-accent-5)">[B, D, ...]</text>

  <!-- _WaitSet -->
  <rect x="306" y="178" width="204" height="34" rx="5" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="319" y="192" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-4)">_WaitSet</text>
  <text x="319" y="207" font-size="8" fill="var(--diagram-accent-4)">等待队列 → WAITING</text>
  <text x="489" y="200" text-anchor="end" font-family="monospace" font-size="9" fill="var(--diagram-accent-4)">[C, E, ...]</text>

  <!-- Flow section title -->
  <text x="272" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">执行流程</text>

  <!-- Step boxes -->
  <!-- Step 1 -->
  <rect x="26" y="280" width="144" height="42" rx="7" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="98" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-1)">① monitorenter</text>
  <text x="98" y="314" text-anchor="middle" font-size="8" fill="var(--diagram-accent-1)">CAS 抢占 _owner</text>

  <!-- Arrow 1→2 -->
  <line x1="170" y1="302" x2="196" y2="302" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arrowB)"/>

  <!-- Step 2 -->
  <rect x="200" y="280" width="144" height="42" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="272" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-2)">② 执行临界区</text>
  <text x="272" y="314" text-anchor="middle" font-size="8" fill="var(--diagram-accent-2)">doSomething()</text>

  <!-- Arrow 2→3 -->
  <line x1="344" y1="302" x2="370" y2="302" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#arrowB)"/>

  <!-- Step 3 normal -->
  <rect x="374" y="280" width="144" height="42" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="446" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-2)">③a monitorexit</text>
  <text x="446" y="314" text-anchor="middle" font-size="8" fill="var(--diagram-accent-2)">正常释放锁</text>

  <!-- Exception path -->
  <rect x="200" y="340" width="144" height="42" rx="7" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.3"/>
  <text x="272" y="357" text-anchor="middle" font-size="9" font-weight="bold" fill="var(--diagram-accent-text-5)">③b monitorexit</text>
  <text x="272" y="374" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">异常路径也要释放</text>

  <!-- Arrow from step 2 down to exception -->
  <line x1="272" y1="323" x2="272" y2="340" stroke="var(--diagram-accent-5)" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="285" y="336" font-size="8" fill="var(--diagram-accent-5)">异常</text>

  <!-- Arrow from step 2 to normal exit -->
  <line x1="344" y1="293" x2="370" y2="293" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>

  <!-- Key insight callout -->
  <rect x="26" y="400" width="493" height="60" rx="7" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="272" y="419" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--diagram-accent-text-4)">关键设计：synchronized 天然不会漏解锁</text>
  <text x="272" y="436" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">编译器保证生成两个 monitorexit（正常 + 异常），与手写 lock.lock()/unlock() 的核心差异</text>
  <text x="272" y="453" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">锁属于对象，不属于代码块 → 每个 Java 对象都能当锁</text>
</svg>
