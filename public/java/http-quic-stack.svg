<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 357" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="221" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">QUIC 协议栈</text>

  <!-- Stack layers from top to bottom -->
  <!-- HTTP/3 -->
  <rect x="68" y="39" width="306" height="42" rx="7" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.7"/>
  <text x="221" y="56" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)" font-weight="bold">HTTP/3</text>
  <text x="221" y="71" text-anchor="middle" font-size="9" fill="var(--diagram-accent-1)">应用层协议（请求/响应语义）</text>

  <!-- Arrow -->
  <line x1="221" y1="82" x2="221" y2="94" stroke="var(--diagram-arrow)" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- QPACK -->
  <rect x="68" y="95" width="306" height="37" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="221" y="110" text-anchor="middle" font-size="12" fill="var(--diagram-accent-text-2)" font-weight="bold">QPACK</text>
  <text x="221" y="126" text-anchor="middle" font-size="9" fill="var(--diagram-accent-2)">头部压缩（替代 HPACK）</text>

  <!-- Arrow -->
  <line x1="221" y1="133" x2="221" y2="144" stroke="var(--diagram-arrow)" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- QUIC Transport -->
  <rect x="68" y="146" width="306" height="119" rx="7" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.7"/>
  <text x="221" y="165" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-4)" font-weight="bold">QUIC Transport</text>

  <!-- Sub-features inside QUIC -->
  <rect x="85" y="173" width="272" height="22" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="221" y="188" text-anchor="middle" font-size="10" fill="var(--diagram-accent-4)">Stream 复用（独立可靠传输）</text>

  <rect x="85" y="201" width="272" height="22" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="221" y="215" text-anchor="middle" font-size="10" fill="var(--diagram-accent-4)">0-RTT 连接建立</text>

  <rect x="85" y="228" width="272" height="22" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
  <text x="221" y="242" text-anchor="middle" font-size="10" fill="var(--diagram-accent-4)">内置 TLS 1.3</text>

  <!-- Arrow -->
  <line x1="221" y1="265" x2="221" y2="277" stroke="var(--diagram-arrow)" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- UDP -->
  <rect x="68" y="279" width="306" height="37" rx="7" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.3"/>
  <text x="221" y="294" text-anchor="middle" font-size="12" fill="var(--diagram-accent-text-3)" font-weight="bold">UDP</text>
  <text x="221" y="309" text-anchor="middle" font-size="9" fill="var(--diagram-accent-3)">传输层（无连接、不可靠 → QUIC 在此之上实现可靠性）</text>

  <!-- Bottom note -->
  <rect x="68" y="326" width="306" height="24" rx="3" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="0.8"/>
  <text x="221" y="342" text-anchor="middle" font-size="9" fill="var(--diagram-text-2)">对比传统：TCP（传输）+ TLS（加密）+ HTTP（应用）三层分离</text>
</svg>
