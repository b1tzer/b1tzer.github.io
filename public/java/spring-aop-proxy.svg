<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663 697" width="663" height="697" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: var(--diagram-text-1); }
  .label { font-size: 12px; fill: var(--diagram-text-1); }
  .note { font-size: 11px; fill: var(--diagram-text-2); }
  .arrow { stroke: var(--diagram-accent-3); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: var(--diagram-surface-3); stroke: var(--diagram-text-2); stroke-width: 1.5; }
  .highlight { fill: var(--diagram-accent-bg-4); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
  .action { fill: var(--diagram-accent-bg-2); stroke: var(--diagram-accent-2); stroke-width: 1.5; }
  .important { fill: var(--diagram-accent-bg-5); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
  .step { fill: var(--diagram-accent-bg-3b); stroke: var(--diagram-accent-3); stroke-width: 1.5; }
  .note-box { fill: var(--diagram-surface-2); stroke: var(--diagram-stroke-1); stroke-width: 1; }
  .cache { fill: var(--diagram-accent-4); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-3)"/>
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-2)"/>
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-4)"/>
  </marker>
</defs>
<text x="332" y="24" class="title">Spring 循环依赖与三级缓存</text>
<rect x="34" y="47" width="289" height="27" rx="5" class="box step"/>
<text x="210.0" y="60" class="label" font-weight="bold">步骤1: 创建 ServiceA</text>
<rect x="34" y="74" width="289" height="70" rx="0 0 6 6" class="box note-box"/>
<text x="47" y="89" text-anchor="start" class="note">singletonObjects: 无</text>
<text x="47" y="105" text-anchor="start" class="note">实例化 ServiceA（调用构造器）</text>
<text x="47" y="120" text-anchor="start" class="note">将 ServiceA 的 ObjectFactory 放入三级缓存</text>
<text x="47" y="135" text-anchor="start" class="note">开始填充属性，发现需要 ServiceB</text>
<line x1="178" y1="147" x2="178" y2="191" class="arrow"/><rect x="34" y="191" width="289" height="27" rx="5" class="box action"/>
<text x="210.0" y="205" class="label" font-weight="bold">步骤2: 创建 ServiceB</text>
<rect x="34" y="218" width="289" height="70" rx="0 0 6 6" class="box note-box"/>
<text x="47" y="234" text-anchor="start" class="note">singletonObjects: 无</text>
<text x="47" y="249" text-anchor="start" class="note">实例化 ServiceB</text>
<text x="47" y="264" text-anchor="start" class="note">将 ServiceB 的 ObjectFactory 放入三级缓存</text>
<text x="47" y="280" text-anchor="start" class="note">开始填充属性，发现需要 ServiceA</text>
<line x1="178" y1="292" x2="178" y2="336" class="arrow"/><rect x="34" y="336" width="289" height="27" rx="5" class="box highlight"/>
<text x="210.0" y="349" class="label" font-weight="bold">步骤3: 解决 ServiceA 的依赖</text>
<rect x="34" y="363" width="289" height="100" rx="0 0 6 6" class="box note-box"/>
<text x="47" y="378" text-anchor="start" class="note">一级缓存: 无 → 二级缓存: 无</text>
<text x="47" y="394" text-anchor="start" class="note">三级缓存: 有 ServiceA 的 ObjectFactory</text>
<text x="47" y="409" text-anchor="start" class="note">调用 ObjectFactory.getObject()</text>
<text x="47" y="424" text-anchor="start" class="note">→ 有 AOP 代理则返回代理对象</text>
<text x="47" y="439" text-anchor="start" class="note">将结果移入二级缓存</text>
<text x="47" y="455" text-anchor="start" class="note">ServiceB 初始化完成 → 放入一级缓存</text>
<line x1="178" y1="467" x2="178" y2="480" class="arrow"/><rect x="34" y="480" width="289" height="27" rx="5" class="box important"/>
<text x="210.0" y="494" class="label" font-weight="bold">步骤4: 回到 ServiceA</text>
<rect x="34" y="507" width="289" height="54" rx="0 0 6 6" class="box note-box"/>
<text x="47" y="523" text-anchor="start" class="note">从一级缓存获取 ServiceB</text>
<text x="47" y="538" text-anchor="start" class="note">ServiceA 属性填充完成，初始化完成</text>
<text x="47" y="553" text-anchor="start" class="note">放入一级缓存，移除二级和三级缓存</text>
<rect x="366" y="68" width="255" height="31" class="box phase"/>
<text x="493" y="83" class="label">一级缓存 singletonObjects</text>
<rect x="366" y="110" width="255" height="31" class="box cache"/>
<text x="493" y="126" class="label">二级缓存 earlySingletonObjects</text>
<rect x="366" y="153" width="255" height="31" class="box highlight"/>
<text x="493" y="168" class="label">三级缓存 singletonFactories</text>

</svg>