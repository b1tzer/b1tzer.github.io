<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 357" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker>
  </defs>
  <text x="204" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">MyBatis 可拦截的四个对象</text>

  <!-- Box -->
  <rect x="68" y="42" width="272" height="280" rx="10" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1.3"/>

  <!-- Executor -->
  <rect x="119" y="68" width="170" height="42" rx="7" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="204" y="87" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="12">Executor</text>
  <text x="204" y="102" text-anchor="middle" fill="var(--diagram-text-2)" font-size="9">SQL 执行入口</text>
  <line x1="204" y1="110" x2="204" y2="132" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar2)"/>

  <!-- ParameterHandler -->
  <rect x="119" y="136" width="170" height="42" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="204" y="155" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="12">ParameterHandler</text>
  <text x="204" y="170" text-anchor="middle" fill="var(--diagram-text-2)" font-size="9">参数设置（? 占位符 → 实际值）</text>
  <line x1="204" y1="178" x2="204" y2="200" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar2)"/>

  <!-- StatementHandler -->
  <rect x="119" y="204" width="170" height="42" rx="7" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.3"/>
  <text x="204" y="223" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold" font-size="12">StatementHandler</text>
  <text x="204" y="238" text-anchor="middle" fill="var(--diagram-text-2)" font-size="9">Statement 准备（prepare → execute）</text>
  <line x1="204" y1="246" x2="204" y2="268" stroke="var(--diagram-arrow)" stroke-width="1.3" marker-end="url(#ar2)"/>

  <!-- ResultSetHandler -->
  <rect x="119" y="272" width="170" height="42" rx="7" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.3"/>
  <text x="204" y="291" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold" font-size="12">ResultSetHandler</text>
  <text x="204" y="306" text-anchor="middle" fill="var(--diagram-text-2)" font-size="9">结果集处理（ResultSet → Java 对象）</text>

  <!-- Side note -->
  <text x="357" y="90" fill="var(--diagram-text-3)" font-size="9">← 每个都可被插件拦截</text>
  <text x="357" y="158" fill="var(--diagram-text-3)" font-size="9">← 每个都可被插件拦截</text>
  <text x="357" y="226" fill="var(--diagram-text-3)" font-size="9">← 每个都可被插件拦截</text>
  <text x="357" y="294" fill="var(--diagram-text-3)" font-size="9">← 每个都可被插件拦截</text>

  <text x="204" y="345" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">MyBatis 插件（Plugin）可以拦截这四个对象的方法调用</text>
</svg>