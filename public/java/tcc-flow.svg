<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663 425" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arT1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-1)"/>
    </marker>
    <marker id="arT2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-2)"/>
    </marker>
    <marker id="arT3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-5)"/>
    </marker>
  </defs>

  <text x="332" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">TCC 事务流程图</text>

  <!-- Service columns -->
  <g transform="translate(80,50)">
    <rect x="0" y="0" width="136" height="31" rx="5" fill="var(--diagram-accent-1)" stroke="none"/>
    <text x="68" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-surface-1)">业务服务</text>
  </g>
  <g transform="translate(310,50)">
    <rect x="0" y="0" width="136" height="31" rx="5" fill="var(--diagram-accent-2)" stroke="none"/>
    <text x="68" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-surface-1)">账户服务</text>
  </g>
  <g transform="translate(540,50)">
    <rect x="0" y="0" width="136" height="31" rx="5" fill="var(--diagram-accent-4)" stroke="none"/>
    <text x="68" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-surface-1)">库存服务</text>
  </g>

  <!-- Vertical lifelines -->
  <line x1="136" y1="76" x2="136" y2="391" stroke="var(--diagram-stroke-1)" stroke-width="0.8" stroke-dasharray="6,4"/>
  <line x1="332" y1="76" x2="332" y2="391" stroke="var(--diagram-stroke-1)" stroke-width="0.8" stroke-dasharray="6,4"/>
  <line x1="527" y1="76" x2="527" y2="391" stroke="var(--diagram-stroke-1)" stroke-width="0.8" stroke-dasharray="6,4"/>

  <!-- TRY phase -->
  <rect x="17" y="85" width="629" height="76" rx="3" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="0.8" opacity="0.3"/>
  <text x="34" y="100" font-size="10" font-weight="bold" fill="var(--diagram-accent-1)">Try 阶段：资源预留</text>

  <!-- Try: Business → Account -->
  <line x1="144" y1="119" x2="321" y2="119" stroke="var(--diagram-accent-1)" stroke-width="1.3" marker-end="url(#arT1)"/>
  <rect x="178" y="107" width="110" height="17" rx="3" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="0.8"/>
  <text x="234" y="119" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-1)">Try：冻结 100 元</text>

  <!-- Try: Business → Inventory -->
  <line x1="144" y1="144" x2="517" y2="144" stroke="var(--diagram-accent-1)" stroke-width="1.3" marker-end="url(#arT1)"/>
  <rect x="280" y="133" width="136" height="17" rx="3" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="0.8"/>
  <text x="348" y="144" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-1)">Try：冻结 1 件库存</text>

  <!-- Decision point -->
  <g transform="translate(60,200)">
    <rect x="0" y="0" width="170" height="24" rx="3" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="0.8"/>
    <text x="85" y="15" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)" font-weight="bold">全部 Try 成功？</text>
  </g>

  <!-- CONFIRM phase (success path) -->
  <rect x="17" y="204" width="629" height="76" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8" opacity="0.3"/>
  <text x="34" y="219" font-size="10" font-weight="bold" fill="var(--diagram-accent-2)">Confirm 阶段：确认提交</text>

  <!-- Confirm: Business → Account -->
  <line x1="144" y1="238" x2="321" y2="238" stroke="var(--diagram-accent-2)" stroke-width="1.3" marker-end="url(#arT2)"/>
  <rect x="178" y="226" width="110" height="17" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="234" y="238" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">Confirm：扣减冻结金额</text>

  <!-- Confirm: Business → Inventory -->
  <line x1="144" y1="264" x2="517" y2="264" stroke="var(--diagram-accent-2)" stroke-width="1.3" marker-end="url(#arT2)"/>
  <rect x="280" y="252" width="136" height="17" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
  <text x="348" y="264" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">Confirm：扣减冻结库存</text>

  <!-- CANCEL phase (failure path) -->
  <rect x="17" y="294" width="629" height="76" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8" opacity="0.3"/>
  <text x="34" y="309" font-size="10" font-weight="bold" fill="var(--diagram-accent-5)">Cancel 阶段：回滚（任何 Try 失败时）</text>

  <!-- Cancel: Business → Account -->
  <line x1="144" y1="328" x2="321" y2="328" stroke="var(--diagram-accent-5)" stroke-width="1.3" marker-end="url(#arT3)"/>
  <rect x="178" y="316" width="110" height="17" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="234" y="328" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-5)">Cancel：解冻金额</text>

  <!-- Cancel: Business → Inventory -->
  <line x1="144" y1="354" x2="517" y2="354" stroke="var(--diagram-accent-5)" stroke-width="1.3" marker-end="url(#arT3)"/>
  <rect x="280" y="342" width="136" height="17" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
  <text x="348" y="354" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-5)">Cancel：解冻库存</text>

  <!-- Arrows from decision -->
  <line x1="221" y1="182" x2="221" y2="204" stroke="var(--diagram-accent-2)" stroke-width="1.3" marker-end="url(#arT2)"/>
  <text x="233" y="197" font-size="8" fill="var(--diagram-accent-2)">是</text>

  <line x1="51" y1="197" x2="51" y2="298" stroke="var(--diagram-accent-5)" stroke-width="1.3" marker-end="url(#arT3)"/>
  <text x="37" y="246" font-size="8" fill="var(--diagram-accent-5)" transform="rotate(-90,44,290)">否</text>

  <!-- Summary -->
  <g transform="translate(100,452)">
    <rect x="0" y="0" width="493" height="31" rx="5" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-2)" stroke-width="0.8"/>
    <text x="246" y="12" text-anchor="middle" font-size="9" fill="var(--diagram-text-2)">Try 阶段冻结资源 → 全部成功则 Confirm 提交 → 任一失败则 Cancel 回滚</text>
    <text x="246" y="26" text-anchor="middle" font-size="8" fill="var(--diagram-ghost)">适用于资金、库存等需要资源预留的场景，比 Saga 一致性更强</text>
  </g>
</svg>