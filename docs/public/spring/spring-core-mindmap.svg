<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    .root { font-size: 15px; font-weight: bold; fill: #2f6b1e; text-anchor: middle; dominant-baseline: central; }
    .branch { font-size: 13px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .leaf { font-size: 11px; fill: #475569; text-anchor: middle; dominant-baseline: central; }
    .rootbox { fill: #eaf4e3; stroke: #5b9e3a; stroke-width: 2; rx: 8; }
    .branchbox { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
    .leafbox { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 5; }
    .link { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
  </style>

  <!-- 主干连线 -->
  <line x1="140" y1="305" x2="185" y2="305" class="link"/>
  <line x1="185" y1="100" x2="185" y2="510" class="link"/>
  <line x1="185" y1="100" x2="210" y2="100" class="link"/>
  <line x1="185" y1="210" x2="210" y2="210" class="link"/>
  <line x1="185" y1="310" x2="210" y2="310" class="link"/>
  <line x1="185" y1="410" x2="210" y2="410" class="link"/>
  <line x1="185" y1="510" x2="210" y2="510" class="link"/>

  <!-- 根节点 -->
  <rect x="30" y="280" width="110" height="50" class="rootbox"/>
  <text x="85" y="305" class="root">Spring 核心</text>

  <!-- 分支节点 -->
  <rect x="210" y="79" width="140" height="42" class="branchbox"/>
  <text x="280" y="100" class="branch">IoC 容器</text>
  <rect x="210" y="189" width="140" height="42" class="branchbox"/>
  <text x="280" y="210" class="branch">依赖注入</text>
  <rect x="210" y="289" width="140" height="42" class="branchbox"/>
  <text x="280" y="310" class="branch">循环依赖</text>
  <rect x="210" y="399" width="140" height="42" class="branchbox"/>
  <text x="280" y="410" class="branch">AOP</text>
  <rect x="210" y="489" width="140" height="42" class="branchbox"/>
  <text x="280" y="510" class="branch">条件装配</text>

  <!-- 分支到叶子的连线 -->
  <line x1="350" y1="100" x2="390" y2="100" class="link"/>
  <line x1="390" y1="100" x2="430" y2="60" class="link"/>
  <line x1="390" y1="100" x2="430" y2="100" class="link"/>
  <line x1="390" y1="100" x2="430" y2="140" class="link"/>

  <line x1="350" y1="210" x2="390" y2="210" class="link"/>
  <line x1="390" y1="210" x2="430" y2="190" class="link"/>
  <line x1="390" y1="210" x2="430" y2="230" class="link"/>

  <line x1="350" y1="310" x2="390" y2="310" class="link"/>
  <line x1="390" y1="310" x2="430" y2="290" class="link"/>
  <line x1="390" y1="310" x2="430" y2="330" class="link"/>

  <line x1="350" y1="410" x2="390" y2="410" class="link"/>
  <line x1="390" y1="410" x2="430" y2="370" class="link"/>
  <line x1="390" y1="410" x2="430" y2="410" class="link"/>
  <line x1="390" y1="410" x2="430" y2="450" class="link"/>

  <line x1="350" y1="510" x2="390" y2="510" class="link"/>
  <line x1="390" y1="510" x2="430" y2="490" class="link"/>
  <line x1="390" y1="510" x2="430" y2="530" class="link"/>

  <!-- IoC 容器叶子 -->
  <rect x="430" y="44" width="160" height="32" class="leafbox"/>
  <text x="510" y="60" class="leaf">IoC 思想</text>
  <rect x="430" y="84" width="250" height="32" class="leafbox"/>
  <text x="555" y="100" class="leaf">BeanFactory vs ApplicationContext</text>
  <rect x="430" y="124" width="180" height="32" class="leafbox"/>
  <text x="520" y="140" class="leaf">refresh 十二步</text>

  <!-- 依赖注入叶子 -->
  <rect x="430" y="174" width="170" height="32" class="leafbox"/>
  <text x="515" y="190" class="leaf">三种注入方式</text>
  <rect x="430" y="214" width="220" height="32" class="leafbox"/>
  <text x="540" y="230" class="leaf">@Autowired vs @Resource</text>

  <!-- 循环依赖叶子 -->
  <rect x="430" y="274" width="150" height="32" class="leafbox"/>
  <text x="505" y="290" class="leaf">三级缓存</text>
  <rect x="430" y="314" width="200" height="32" class="leafbox"/>
  <text x="530" y="330" class="leaf">构造器注入为何无解</text>

  <!-- AOP 叶子 -->
  <rect x="430" y="354" width="170" height="32" class="leafbox"/>
  <text x="515" y="370" class="leaf">切面与切点</text>
  <rect x="430" y="394" width="200" height="32" class="leafbox"/>
  <text x="530" y="410" class="leaf">JDK Proxy vs CGLIB</text>
  <rect x="430" y="434" width="150" height="32" class="leafbox"/>
  <text x="505" y="450" class="leaf">代理失效</text>

  <!-- 条件装配叶子 -->
  <rect x="430" y="474" width="160" height="32" class="leafbox"/>
  <text x="510" y="490" class="leaf">@Conditional</text>
  <rect x="430" y="514" width="150" height="32" class="leafbox"/>
  <text x="505" y="530" class="leaf">@Profile</text>
</svg>
