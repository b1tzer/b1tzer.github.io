<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 391" width="476" height="391">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>

  <!-- Layer 1: Java Language -->
  <rect x="51" y="17" width="374" height="85" rx="10" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="238" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-1)">Java 语言层</text>
  <text x="238" y="64" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)">happens-before / volatile /</text>
  <text x="238" y="83" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)">synchronized / final</text>

  <!-- Arrow 1 -->
  <line x1="238" y1="102" x2="238" y2="144" stroke="var(--diagram-arrow)" stroke-width="2.1" marker-end="url(#arrowDown)"/>
  <text x="238" y="128" text-anchor="middle" font-size="10" fill="var(--diagram-text-2)" font-weight="bold">语义翻译</text>

  <!-- Layer 2: JVM / JIT -->
  <rect x="51" y="151" width="374" height="85" rx="10" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="238" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-2)">JVM / JIT</text>
  <text x="238" y="202" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-2)">在合适位置插入屏障与顺序约束</text>
  <text x="238" y="221" text-anchor="middle" font-size="9" fill="var(--diagram-accent-2)">StoreStore / LoadLoad / StoreLoad / LoadStore</text>

  <!-- Arrow 2 -->
  <line x1="238" y1="236" x2="238" y2="279" stroke="var(--diagram-arrow)" stroke-width="2.1" marker-end="url(#arrowDown)"/>
  <text x="238" y="264" text-anchor="middle" font-size="10" fill="var(--diagram-text-2)" font-weight="bold">指令执行</text>

  <!-- Layer 3: CPU -->
  <rect x="51" y="286" width="374" height="85" rx="10" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="238" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-5)">CPU</text>
  <text x="238" y="336" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-5)">缓存 / 一致性协议 / 乱序执行</text>
  <text x="238" y="357" text-anchor="middle" font-size="9" fill="var(--diagram-accent-5)">x86(TSO) / ARM(弱) / RISC-V(可配置)</text>

  <!-- Side annotation -->
  <rect x="434" y="153" width="34" height="212" rx="3" fill="none" stroke="var(--diagram-stroke-2)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="450" y="264" text-anchor="middle" font-size="8" fill="var(--diagram-arrow)" writing-mode="tb">三层协作是 Java 并发能被推理的物理基础</text>
</svg>
