<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 323" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="221" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">Selector 多路复用器</text>
  <!-- Selector thread -->
  <rect x="136" y="42" width="170" height="51" rx="7" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.7"/>
  <text x="221" y="65" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">Selector 线程</text>
  <text x="221" y="82" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">select() 阻塞等待事件</text>
  <!-- Channels -->
  <rect x="34" y="170" width="102" height="60" rx="7" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
  <text x="85" y="194" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">Channel 1</text>
  <text x="85" y="211" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">可读事件 ✓</text>
  <text x="85" y="224" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">客户端连接</text>
  <rect x="170" y="170" width="102" height="60" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
  <text x="221" y="194" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Channel 2</text>
  <text x="221" y="211" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">可写事件 ✓</text>
  <text x="221" y="224" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">客户端连接</text>
  <rect x="306" y="170" width="102" height="60" rx="7" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1.3"/>
  <text x="357" y="194" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">Channel N</text>
  <text x="357" y="211" text-anchor="middle" fill="var(--diagram-ghost)" font-size="10">无事件</text>
  <text x="357" y="224" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">客户端连接</text>
  <!-- Arrows -->
  <line x1="170" y1="94" x2="85" y2="168" stroke="var(--diagram-accent-1)" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="221" y1="94" x2="221" y2="168" stroke="var(--diagram-accent-2)" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="272" y1="94" x2="357" y2="168" stroke="var(--diagram-stroke-1)" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <!-- Event labels -->
  <text x="110" y="136" fill="var(--diagram-accent-1)" font-size="9">OP_READ</text>
  <text x="228" y="136" fill="var(--diagram-accent-2)" font-size="9">OP_WRITE</text>
  <!-- Footer -->
  <text x="221" y="264" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">一个线程通过 select() 同时监听多个 Channel 的 I/O 事件</text>
  <text x="221" y="280" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">只有就绪的 Channel 才会被处理，无需为每个连接阻塞一个线程</text>
  <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker></defs>
</svg>