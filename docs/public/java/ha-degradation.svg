<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 340" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arH1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-text-2)"/>
    </marker>
  </defs>

  <text x="298" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">服务降级：线程池隔离</text>

  <!-- API Gateway -->
  <g transform="translate(220,48)">
    <rect x="0" y="0" width="221" height="37" rx="5" fill="var(--diagram-accent-1)" stroke="none"/>
    <text x="110" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-surface-1)">API Gateway</text>
  </g>

  <!-- Three arrows down -->
  <line x1="196" y1="82" x2="102" y2="110" stroke="var(--diagram-text-2)" stroke-width="1.3" marker-end="url(#arH1)"/>
  <line x1="298" y1="82" x2="298" y2="110" stroke="var(--diagram-text-2)" stroke-width="1.3" marker-end="url(#arH1)"/>
  <line x1="400" y1="82" x2="493" y2="110" stroke="var(--diagram-text-2)" stroke-width="1.3" marker-end="url(#arH1)"/>

  <!-- Order Service -->
  <g transform="translate(30,134)">
    <rect x="0" y="0" width="153" height="94" rx="7" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
    <text x="76" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">订单服务</text>
    <rect x="13" y="31" width="128" height="24" rx="3" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
    <text x="76" y="46" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">线程池 A</text>
    <rect x="13" y="61" width="128" height="24" rx="3" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="0.8"/>
    <text x="76" y="76" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-2)">20 线程</text>
  </g>

  <!-- Payment Service -->
  <g transform="translate(260,134)">
    <rect x="0" y="0" width="153" height="94" rx="7" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.3"/>
    <text x="76" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-5)">支付服务</text>
    <rect x="13" y="31" width="128" height="24" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
    <text x="76" y="46" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-5)">线程池 B</text>
    <rect x="13" y="61" width="128" height="24" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="0.8"/>
    <text x="76" y="76" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-5)">10 线程</text>
  </g>

  <!-- Inventory Service -->
  <g transform="translate(490,134)">
    <rect x="0" y="0" width="153" height="94" rx="7" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.3"/>
    <text x="76" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-1)">库存服务</text>
    <rect x="13" y="31" width="128" height="24" rx="3" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="0.8"/>
    <text x="76" y="46" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-1)">线程池 C</text>
    <rect x="13" y="61" width="128" height="24" rx="3" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="0.8"/>
    <text x="76" y="76" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-1)">15 线程</text>
  </g>

  <!-- Failure scenario -->
  <g transform="translate(260,256)">
    <rect x="0" y="0" width="153" height="31" rx="3" fill="var(--diagram-accent-5)" stroke="none" opacity="0.15"/>
    <text x="76" y="12" text-anchor="middle" font-size="9" fill="var(--diagram-accent-5)" font-weight="bold">支付服务变慢</text>
    <text x="76" y="26" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">→ 只耗尽线程池 B</text>
  </g>

  <!-- Result -->
  <g transform="translate(100,310)">
    <rect x="0" y="0" width="425" height="42" rx="5" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.3"/>
    <text x="212" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">✓ 订单和库存不受影响</text>
    <text x="212" y="34" text-anchor="middle" font-size="9" fill="var(--diagram-accent-2)">故障被隔离在支付服务的线程池内，不会扩散到其他服务</text>
  </g>

  <!-- Core principle -->
  <g transform="translate(100,372)">
    <text x="212" y="12" text-anchor="middle" font-size="10" fill="var(--diagram-text-2)" font-style="italic">核心思想：一个服务出问题，不应该拖垮整个系统（舱壁模式 Bulkhead Pattern）</text>
  </g>
</svg>